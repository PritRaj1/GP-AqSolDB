[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-kan"
version = "0.1.0"
authors = [{name = "Prithvi Raj", email = "prithvi@zscc.ai"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]",
    "optax",
    "jax_dataclasses",
    "numpy",
    "scipy",
    "scikit-learn",
    "optuna",
    "matplotlib",
    "seaborn",
    "pandas",
    "imageio",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x",
]
notebooks = [
    "ipykernel",
    "jupyter",
    "pandas",
    "rdkit",
]

[project.scripts]
gp-kan = "src.__main__:main"

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=html --cov-report=term-missing -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
