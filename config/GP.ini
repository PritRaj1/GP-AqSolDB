[KERNEL]
type="RBF"
lmbda=1.0
alpha=1.0
use_cache=true
cache_size=100
sparse=false
num_inducing=20

[SPARSE]
use_sparse=false
num_inducing=20
inducing_method=random

[PARALLEL]
# Enable/disable parallel processing for kernel computations
use_parallel=true
# Number of parallel jobs (None for auto-detect, 0 for single-threaded)
n_jobs=None
# Size of chunks for parallel processing (larger chunks = less overhead)
chunk_size=1000
# Enable GPU acceleration if available
use_gpu=false
# Minimum matrix size to use parallel processing (NxN)
min_size_for_parallel=500

[TUNING]
n_trials=100
timeout=3600