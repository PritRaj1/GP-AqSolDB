[NETWORK]
input_size = 26
output_size = 1

[GP]
num_inducing_points = 20
z_init_low = -2.0
z_init_high = 2.0
h_init_low = -1.0
h_init_high = 1.0
global_length_scale = 0.4
min_length_scale = 0.2
global_covariance_scale = 1.0
min_covariance_scale = 0.1
global_jitter = 0.001
baseline_jitter = 0.01

[KERNEL]
type = RQ
lmbda = 0.0933426599707739
alpha = 0.5011734927882655

[SPARSE]
use_sparse = true
num_inducing = 94
inducing_method = kmeans

[NORMALIZATION]
min_var = 0.2

[TRAINING]
seed = 42
learning_rate = 0.001
num_epochs = 30
batch_size = 32
pretrain_iters = 10

[DEVICE]
use_gpu = true
device = gpu
precision = float32

